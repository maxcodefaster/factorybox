services:
  workspace:
    image: docker.io/library/node:24.21.0-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    command: ["/bin/sh", "-c", "while sleep 1000; do :; done"]
    working_dir: /workspace
    volumes:
      - ..:/workspace
    cap_drop: [NET_RAW, SYS_PTRACE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      dependency:
        condition: service_healthy
  dependency:
    image: docker.io/library/node:24.21.0-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    command: ["node", "-e", "require('node:http').createServer((req,res)=>res.end('dependency-ready\\n')).listen(8081,'0.0.0.0')"]
    cap_drop: [NET_RAW, SYS_PTRACE]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 32
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 1s
      retries: 20
